name: Python tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project_nova/**'
      - 'tests/**'
      - '.github/workflows/tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline demo smoke test
        env:
          NOVA_ENABLE_EXTERNAL_MODEL: "NO"
        run: |
          python -m project_nova --once
          python -m project_nova --ask "Hello"
          python -m project_nova --status
